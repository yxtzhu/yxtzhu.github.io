<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B07A"/>
      <stop offset="100%" stop-color="#A8703A"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0E8DF"/>
      <stop offset="100%" stop-color="#C8B8A8"/>
    </radialGradient>
  </defs>
  <!-- Full bleed (maskable safe zone is centered ~410x410) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Plate centered in safe zone -->
  <circle cx="256" cy="262" r="118" fill="url(#plate)" opacity="0.95"/>
  <circle cx="256" cy="262" r="92"  fill="none" stroke="#B8A898" stroke-width="3" opacity="0.6"/>

  <!-- Apple -->
  <path d="M256 212
           C 226 212, 210 230, 210 258
           C 210 294, 234 326, 256 326
           C 278 326, 302 294, 302 258
           C 302 230, 286 212, 256 212 Z"
        fill="#C84040" opacity="0.92"/>
  <ellipse cx="236" cy="240" rx="12" ry="18" fill="#F0E8DF" opacity="0.35"/>
  <path d="M256 212 Q256 196 264 188" stroke="#5A3A22" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M264 196 Q280 188 288 200 Q276 208 264 204 Z" fill="#7B8F6B"/>
</svg>
