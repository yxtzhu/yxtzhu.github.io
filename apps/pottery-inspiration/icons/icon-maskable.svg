<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4956A"/>
      <stop offset="100%" stop-color="#7B5B3A"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background (no rounded corners for maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Vase centered in the safe zone (inner ~410x410 at 51px inset) -->
  <!-- Belly -->
  <ellipse cx="256" cy="310" rx="100" ry="82" fill="#1E1B18" opacity="0.85"/>
  <!-- Neck -->
  <rect x="224" y="188" width="64" height="84" rx="10" fill="#1E1B18" opacity="0.85"/>
  <!-- Flared rim -->
  <ellipse cx="256" cy="188" rx="50" ry="16" fill="#1E1B18" opacity="0.85"/>
  <!-- Bottom base -->
  <ellipse cx="256" cy="390" rx="66" ry="14" fill="#1E1B18" opacity="0.85"/>
  <!-- Connecting neck to belly -->
  <path d="M224 230 Q196 268 156 310 Q156 395 256 395 Q356 395 356 310 Q316 268 288 230 Z" fill="#1E1B18" opacity="0.85"/>
  <!-- Glaze highlight -->
  <ellipse cx="222" cy="290" rx="20" ry="34" fill="#7B8F6B" opacity="0.35"/>
  <!-- Rim inner highlight -->
  <ellipse cx="256" cy="185" rx="28" ry="9" fill="#9B7F62" opacity="0.4"/>
</svg>
